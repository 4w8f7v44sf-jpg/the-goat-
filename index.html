.ch{cursor:pointer}

section{animation:fi .8s both}@keyframes fi{from{opacity:0;transform:translateY(18px)}}

.hero .art{display:block;width:min(560px,92%);margin:6px auto 22px}

.num{font-family:Georgia,serif;font-size:2.6rem;color:var(--mut);display:block;line-height:1;margin-bottom:12px;transition:.3s}
.sub{position:relative;overflow:hidden;min-height:150px}
.sub:hover{background:var(--ink);color:var(--bg)}.sub:hover .mut,.sub:hover .num{color:var(--bg);opacity:.75}
.tl{position:relative;padding-inline-start:36px;margin-top:14px}
.tl:before{content:"";position:absolute;inset-inline-start:9px;top:8px;bottom:8px;width:1px;background:var(--ink);opacity:.28}

const pt=(i,r)=>{const a=-Math.PI/2+i*Math.PI/3;return[c+Math.cos(a)*r,c+Math.sin(a)*r]};
const ring=[.33,.66,1].map(f=>`<polygon points="${k.map((_,i)=>pt(i,R0*f).join(",")).join(" ")}" fill="none" stroke="currentColor" opacity=".18"/>`).join("");
const poly=k.map((n,i)=>pt(i,R0*Math.max(.08,sc[n]/100)).join(",")).join(" ");
const lab=k.map((_,i)=>{const[p,q]=pt(i,R0+26);return`<text x="${p}" y="${q}" text-anchor="middle" font-size="12" fill="currentColor">${x.ax[i]}</text>`}).join("");
$("rad").innerHTML=`<svg viewBox="0 0 260 260" width="300" style="max-width:100%;color:var(--ink)">${ring}<polygon points="${poly}" fill="currentColor" fill-opacity=".12" stroke="currentColor" stroke-width="1.6"/>${lab}</svg>`}

$("adv").innerHTML=o.map(z=>`<div class="adv">✦ ${z}</div>`).join("")}

const TIPS={fr:[["Rappel actif","Ferme ton cahier et écris tout ce dont tu te souviens. Se tester apprend plus que relire.","Exemple : après un chapitre, 5 minutes pour réexpliquer à voix haute, sans notes."],["Répétition espacée","Revois une notion demain, dans 3 jours, puis dans 10 jours. Le cerveau garde ce qu’il revoit juste avant d’oublier.","Exemple : une formule de maths revue 3 fois vaut mieux qu’une nuit entière dessus."],["Technique de Feynman","Si tu sais l’expliquer simplement à un enfant, tu l’as compris.","Exemple : explique les limites avec une histoire de route qui s’approche d’une ville."],["Le sommeil fixe la mémoire","Pendant la nuit, le cerveau range ce que tu as appris. Dormir, c’est réviser.","Exemple : 20 minutes de révision, puis dormir, bat une nuit blanche."],["Erreur = information","Une erreur te montre exactement où ton cerveau doit encore grandir.","Exemple : note tes erreurs d’exercices dans une page « Mes trésors »."],["Petits pas","Commence par 10 minutes. Le plus dur, c’est de s’asseoir, pas d’étudier.","Exemple : « J’ouvre juste le chapitre » devient souvent une heure."],["Respire","Inspire 4 secondes, expire 6 secondes, trois fois. Le stress baisse et la mémoire revient.","Exemple : avant un examen, à ta place, sans que personne le voie."]],
en:[["Active recall","Close your notebook and write everything you remember. Testing yourself teaches more than rereading.","Example: after a chapter, spend 5 minutes re-explaining it aloud, no notes."],["Spaced repetition","Review an idea tomorrow, in 3 days, then in 10. The brain keeps what it revisits just before forgetting.","Example: a formula reviewed 3 times beats a whole night on it."],["The Feynman technique","If you can explain it simply to a child, you understood it.","Example: explain limits as a road getting closer to a city."],["Sleep locks memory","At night, your brain files what you learned. Sleeping is revising.","Example: 20 minutes of review then sleep beats an all-nighter."],["Mistake = information","A mistake shows exactly where your brain still has room to grow.","Example: keep a page called ‘My treasures’ for exercise errors."],["Small steps","Start with 10 minutes. The hard part is sitting down, not studying.","Example: ‘I’ll just open the chapter’ often becomes an hour."],["Breathe","Inhale 4 seconds, exhale 6, three times. Stress drops and memory returns.","Example: before an exam, at your desk, unseen."]],
ar:[["الاسترجاع النشط","سكّر كراسك واكتب كل ما تتذكّره. تختبر روحك أحسن من تعاود تقرا.","مثال : بعد كل فصل، خمس دقايق تعاود تشرحو بصوت عالي من غير ملاحظات."],["التكرار المتباعد","راجع الفكرة غدوة، بعد ثلاثة أيام، وبعد عشرة. المخ يحفظ اللي يراجعو قبل ما ينساه.","مثال : قانون في الرياضيات تراجعو ثلاث مرات أحسن من ليلة كاملة."],["طريقة فاينمان","كان تقدر تشرحها لطفل ببساطة، معناها فهمتها.","مثال : اشرح النهايات كطريق يقرّب من مدينة."],["النوم يثبّت الذاكرة","في الليل المخ يرتّب اللي تعلّمتو. النوم كيما المراجعة.","مثال : عشرين دقيقة مراجعة وبعد نوم أحسن من سهرة كاملة."],["الغلطة معلومة","الغلطة تبيّنلك وين مخّك لازم يكبر.","مثال : اكتب أغلاطك في ورقة اسمها ‘كنوزي’."],["خطوات صغيرة","ابدأ بعشر دقايق. الصعيب في القعدة، موش في القراية.","مثال : ‘نحل الفصل برك’ برشا مرّات تولّي ساعة."],["تنفّس","شهيق أربع ثواني وزفير ست ثواني، ثلاث مرّات. التوتر ينقص والذاكرة ترجع.","مثال : قبل الامتحان في بلاصتك من غير ما حد يشوف."]]};
const LES={fr:{t:"Suites arithmétiques — leçon d’exemple",s:[["Une suite, c’est quoi ?","Une liste de nombres rangés : u₀, u₁, u₂…",["3","7","11","15"]],["Arithmétique","On ajoute toujours la même raison r : uₙ₊₁ = uₙ + r. Ici r = 4.",["+4","+4","+4"]],["Le terme général","uₙ = u₀ + n × r. Donc u₁₀ = 3 + 10 × 4 = 43.",["u₁₀ = 43"]],["La somme","S = (n+1)(u₀ + uₙ) / 2. Un seul calcul au lieu de tout additionner.",["Σ"]]]},

function mcSents(t){return t.replace(/\r/g,"").split(/(?<=[.!?؟…:;])\s+|\n+/).map(z=>z.replace(/\s+/g," ").trim()).filter(z=>z.length>18&&z.length<400)}
function mcWords(t){return(t.toLowerCase().match(/[\p{L}\p{N}]+/gu)||[]).filter(w=>w.length>3&&!MC_STOP.has(w)&&!/^\d+$/.test(w))}
function mcSummarize(text,lv){text=text.slice(0,80000);const lines=text.replace(/\r/g,"").split(/\n+/).map(z=>z.replace(/\s+/g," ").trim()).filter(Boolean);
const isH=z=>z.length>=3&&z.length<=80&&!/[.!?؟]$/.test(z)&&(/^(\d+[\.\)\-]|[IVXivx]+[\.\)]|[A-Da-d][\.\)]|chapitre|partie|section|titre|الفصل|الباب)/i.test(z)||(z===z.toUpperCase()&&/[A-ZÀ-Ý]{3}/.test(z))||/:$/.test(z));
const secs=[];let cur={h:"",t:[]};for(const ln of lines){if(isH(ln)){if(cur.t.length){secs.push(cur);cur={h:ln.replace(/:$/,""),t:[]}}else cur.h=ln.replace(/:$/,"")}else cur.t.push(ln)}secs.push(cur);
const ss=mcSents(lines.join("\n"));if(ss.length<3)return null;const f={};mcWords(lines.join(" ")).forEach(w=>f[w]=(f[w]||0)+1);const max=Math.max(1,...Object.values(f));
const cue=/(définition|on appelle|théorème|propriété|formule|important|à retenir|retenir|attention|definition|theorem|property|remember|تعريف|يسمى|نظرية|خاصية|تذكر|مهم)/i;
const score=(s,i,n)=>{const w=mcWords(s);let v=w.reduce((a,x)=>a+(f[x]||0)/max,0)/Math.sqrt(w.length+1);if(cue.test(s))v+=1.2;if(/[=≤≥<>∫√Σ%]|\d/.test(s))v+=.4;if(i<n*.15)v+=.3;return v};
const ratio=[.2,.35,.55][lv],cap=[12,24,50][lv],budget=Math.min(cap,Math.max(4,Math.round(ss.length*ratio)));
const parts=secs.map(sec=>{const sx=mcSents(sec.t.join("\n"));if(!sx.length)return{h:sec.h,s:[]};const share=Math.max(lv==0?1:2,Math.round(budget*sx.length/ss.length));const idx=sx.map((z,i)=>[score(z,i,sx.length),i]).sort((p,q)=>q[0]-p[0]).slice(0,Math.min(share,sx.length)).sort((p,q)=>p[1]-q[1]);return{h:sec.h,s:idx.map(z=>sx[z[1]])}}).filter(p=>p.s.length);
const top=ss.map((z,i)=>[score(z,i,ss.length),i]).sort((p,q)=>q[0]-p[0]).slice(0,lv==2?10:8).sort((p,q)=>p[1]-q[1]).map(z=>ss[z[1]]);
const defRe=/(on appelle|est appelé|désigne|définition|se définit|est défini|est un |est une |sont des |is called|is defined|refers to|تعريف|يسمى|يُسمى| هو | هي )/i,L2=lv==2?2:1;
const defs=ss.filter(z=>defRe.test(z)&&z.length<280).slice(0,6*L2);

const forms=[...new Set(lines.filter(z=>z.length>3&&z.length<130&&/[=≤≥∫√Σ]|\b(sin|cos|ln|lim|log)\b|\^|²|³/.test(z)))].slice(0,10*L2);
const examples=ss.filter(z=>/^(exemple|ex\s?:|example|مثال)|par exemple|for example/i.test(z)).slice(0,5*L2);
const methods=ss.filter(z=>/(méthode|étape|il faut|on doit|d’abord|ensuite|enfin|pour (calculer|montrer|déterminer|étudier|résoudre)|first|then|step|يجب|أولا|ثم)/i.test(z)).slice(0,6*L2);

const kw=Object.entries(f).filter(([w])=>w.length>4).sort((p,q)=>q[1]-p[1]).slice(0,lv==2?20:10).map(z=>z[0]);

return{parts,top,defs,terms,forms,examples,methods,pit,kw,dates,f,n:ss.length,kept:parts.reduce((a,p)=>a+p.s.length,0)}}
function mcQuizQ(sm){const pool=[...new Set([...sm.parts.flatMap(p=>p.s),...sm.top,...sm.defs])].filter(v=>v.length>35&&v.length<230);const all=Object.entries(sm.f).filter(([w])=>w.length>4).sort((a,b)=>b[1]-a[1]).slice(0,25).map(z=>z[0]);
let seed=7;const rnd=()=>(seed=(seed*1103515245+12345)>>>0)/4294967296;const qs=[];
for(const s of pool){const ws=mcWords(s).filter(w=>w.length>4).sort((a,b)=>sm.f[b]-sm.f[a]);if(!ws.length)continue;const kw=ws[0];const wr=all.filter(w=>w!=kw&&!s.toLowerCase().includes(w));if(wr.length<3)continue;

qs.push({q:s.replace(new RegExp(kw.replace(/[.*+?^${}()|[\]\\]/g,"\\$&"),"i"),"_____"),o,a:o.indexOf(kw),e:s});if(qs.length>=((S.mcl??2)==2?10:6))break}return qs}

[["t3","t3"],["d3","d3"],["lsd","sd"],["lstt","st"],["lmg","mg"],["lms","ms"],["lmh","mh"],["t4","t4"],["d4","d4"],["lwk","wk"],["len","en"],["lbd","bd"],["lsa","sa"],["lsu","su"],["lph","ph"],["lwt","wt"],["t5","t5"],["d5","d5"],["lsg","sg"],["lfv","fv"],["lhd","hd"],["lgl","gl"],["ldr","dr"],["n3","nx"],["n4","nx"],["n5","fin"],["gate","gate"],["skipb","skip"],["rgp","seep"],["rgo","seec"]].forEach(([a,b])=>{const el=$(a);if(el)el.textContent=p[b]});

document.addEventListener("click",e=>{const d=e.target.closest("[data-pc]");if(!d)return;const k=d.dataset.pc,i=+d.dataset.pi,P=S.pf;if(Array.isArray(P[k]))P[k]=P[k].includes(i)?P[k].filter(z=>z!=i):[...P[k],i];else P[k]=P[k]===i?null:i;pfUi();save()});

function pfResult(){const p=PF(),P=S.pf,mv=musicV();S.mv=mv;const lyr=P.mg.some(i=>i==0||i==1)&&P.ms!=2&&mv!=0;
let h=`<div class="sec3"><h4>${p.pot}</h4><div class="potc">${P.sg.map(i=>`<span class="kw">${p.sgv[i]}</span>`).join("")}</div>${P.sg.slice(0,5).map(i=>`<div class="adv">✦ ${p.tips[i]}</div>`).join("")}`;

function buildPlan(){const P=S.pf,x=PLT(),W=P.wk,E=P.en,B=P.bd,sess=S.sess||25,blk=(2*sess+5)/60,rows=[];
let ids=subs().filter(id=>chl(id).length);if(!ids.length)ids=subs();const w=[];ids.forEach(id=>{w.push(id);if(id==P.hd)w.push(id)});const cnt={};let qi=0;
const base=(S.lv=="bac"?3:2)-((S.scores&&S.scores.calm<40)?1:0),pref=S.chr==0?9:S.chr==1?15.5:S.chr==2?19.5:16;
for(let d=0;d<7;d++){const it=[],school=d<5||(d==5&&P.sat===0),end=d<5?E:12.5;
if(d<5)it.push([W+1,E,x.school,"s"]);else if(d==5&&P.sat===0)it.push([W+1,12.5,x.school,"s"]);
const ls=school?end:12.75;it.push([ls,ls+.75,x.lunch,"m"]);it.push([19.75,20.5,x.dinner,"m"]);
if(P.sd.includes(d)){let ts=P.st===0?[W,W+1]:P.st===1?[E+1,E+2]:[18,19.25];if(d>=5&&P.st===0)ts=[8.5,9.5];if(d>=5&&P.st===1)ts=[15,16];it.push([ts[0],ts[1],x.sport+(S.sport?" — "+S.sport:""),"p"])}
if(P.sup.includes(d)){const ts=d>=5?[10,12]:E<=16?[16.5,18.5]:[E+.5,E+2.5];it.push([ts[0],ts[1],x.support,"s"])}
const on=S.days.includes(d);
if(!on){it.push([W+1.5,W+1.51,x.rest,"z"])}else{
let load=base+(d>=5?1:0);const a=school?ls+.75:W+1.5,b=B-1.25,bs=it.filter(z=>z[1]>a&&z[0]<b).sort((p,q)=>p[0]-q[0]);let t=a;const gp=[];for(const z of bs){if(z[0]-t>=blk+.2)gp.push([t,z[0]]);t=Math.max(t,z[1])}if(b-t>=blk+.2)gp.push([t,b]);
gp.sort((p,q)=>Math.abs((p[0]+p[1])/2-pref)-Math.abs((q[0]+q[1])/2-pref));
for(const g of gp){let t0=g[0]+.1;while(load>0&&g[1]-t0>=blk){const id=w[qi++%w.length],ch=chl(id),k=(cnt[id]||0),c=cn(ch[k%ch.length]);cnt[id]=k+1;const rev=d==6&&load==base+1;
it.push([t0,t0+blk,rev?x.review:`${x.study} · ${sn(id)} · ${c} ${S.mv==0?"🔇":"🎧"}`,"st"]);t0+=blk+.2;load--}}}
it.push([B,B+.01,x.sleep,"z"]);it.sort((p,q)=>p[0]-q[0]);
rows.push(...it.map(z=>({d,t:z[3]=="z"?fmtH(z[0]):fmtH(z[0])+"–"+fmtH(z[1]),w:z[2],k:z[3]})))}
return rows}
function plan(){const x=PLT(),P=S.pf,rows=buildPlan(),names=T[L].days;let h=`<tr><th>${x.cols[0]}</th><th>${x.cols[1]}</th><th>${x.cols[2]}</th></tr>`;
for(let d=0;d<7;d++){const r=rows.filter(z=>z.d==d);r.forEach((z,i)=>{h+=`<tr class="r-${z.k}">${i==0?`<td class="dcell" rowspan="${r.length}">${names[d]}</td>`:""}<td>${z.t}</td><td>${z.w}</td></tr>`})}
$("plan").innerHTML=h;$("plsum").textContent=x.sum.replace("{n}",S.sess||25).replace("{c}",S.chr!=null?x.chr[S.chr]:"—").replace("{s}",P.sd.length?P.sd.map(i=>names[i]).join(", "):x.nos)}
